name: CI

# PR CI re-enabled 2026-07-26 (Oracle L1). It was disabled on 2026-07-03 (Nat)
# with the reason "gating happens locally (Rust builds on m5)" — that premise no
# longer holds. Wind's 2026-07-26 ruling (88706d8) forbids ALL local cargo
# commands in this repo after a scoped build exhausted memory and killed three
# live L2 panes mid-delivery. With local gating gone AND PR CI off, a maw-rs PR
# had no verification at all: the schedule only runs on main, i.e. after merge.
# Restoring pull_request is what makes "CI is the gate" true rather than aspirational.
#
# The 4-hour schedule stays as the main-branch safety net.
on:
  pull_request:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect CI-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      non_docs: ${{ steps.filter.outputs.non_docs }}
    steps:
      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4

      - name: Detect non-documentation changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            non_docs:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!AGENTS.md'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'
          predicate-quantifier: every

  rust:
    name: Rust workspace
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.non_docs == 'true'
    # Self-hosted runner deferred until TK's Linux test server is ready.
    runs-on: ubuntu-latest
    # `.cargo/config.toml` commits `[build] target-dir = "/tmp/maw-rs-target"` so
    # that many worktrees on the shared dev box do not each grow a 30GB target/
    # (#121). On a runner that is pure cost: `Swatinem/rust-cache` resolves
    # `cache-targets` against the workspace root, finds no `./target`, and caches
    # only ~/.cargo/registry. Measured before this line: whole-repo Actions cache
    # 166MB across 21 entries, restore 8s, `Post Cache Cargo` "cache up to date"
    # in 3s after a full cold build — i.e. every run recompiled the workspace,
    # which is `Build workspace tests` 6m11s + `Test workspace` 5m47s, two thirds
    # of the job. See #184.
    #
    # CARGO_TARGET_DIR (env) takes precedence over build.target-dir (config), so
    # this restores the default location for CI only. Do NOT "fix" this by editing
    # .cargo/config.toml — the dev box has hit disk exhaustion twice and #121
    # depends on that redirect.
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Measured on run 30326663734 (2026-07-28): the step ran all 7 reclaim
      # options (only tool-cache/large-packages were pinned; the rest default
      # true) and took 2m59s for 31GiB. Per-option cost/yield from that run's
      # log (`=> <name>: Saved <size>`, timestamped):
      #   android          71.5s /  11GiB  (11GiB is the biggest single win,
      #                                     but also the single slowest step —
      #                                     not "seconds" as first assumed)
      #   large-packages   54.1s / 4.5GiB  (apt purge; worst s/GiB of all: ~12)
      #   tool-cache       28.3s / 5.3GiB  (best throughput of the big ones)
      #   docker-images    13.1s / 1.9GiB  (irrelevant — job never uses docker)
      #   dotnet            9.8s / 5.1GiB
      #   haskell           2.4s / 3.6GiB
      #   swap-storage      0.0s /    0B   (no swapfile on this image)
      # Runner starts this step with 88GB free (145GB image, `df -h /` before
      # cleanup). The full 7-option cleanup used to push that to 119GB before
      # build+test+clippy ran (and always finished green from there — no
      # ENOSPC on record). Disabling android/large-packages/docker-images and
      # keeping tool-cache+dotnet+haskell+swap-storage cuts the step to ~40s
      # (~2m20s saved) while still reclaiming ~14GiB, leaving ~103GB free
      # before the build starts: 16GB less than the old 119GB starting point,
      # but still 15GB above the 88GB the runner has before any cleanup at
      # all. See issue #181 for the full breakdown; do not re-enable
      # large-packages without new data showing the workspace needs the room.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup +1.97.1 target add wasm32-unknown-unknown

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fleet-plugin bun tests
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for plugin in fleet-plugins/*; do
            [ -d "$plugin" ] || continue

            if [ -f "$plugin/package.json" ]; then
              echo "::group::bun install $(basename "$plugin")"
              (cd "$plugin" && bun install)
              echo "::endgroup::"
            fi

            shopt -s nullglob
            tests=("$plugin"/src/*.test.ts)
            shopt -u nullglob
            if [ "${#tests[@]}" -eq 0 ]; then
              echo "No bun tests in $plugin; skipping"
              continue
            fi

            found=1
            rel_tests=()
            for test in "${tests[@]}"; do
              rel_tests+=("./${test#$plugin/}")
            done

            echo "::group::bun test $(basename "$plugin")"
            (cd "$plugin" && bun test "${rel_tests[@]}")
            echo "::endgroup::"
          done

          if [ "$found" -eq 0 ]; then
            echo "No fleet-plugin bun tests found; skipping"
          fi

      - name: Setup Node cache for WASM fixtures
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/wasm-sdk/package-lock.json

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-workspace-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: true
          cache-targets: true

      - name: Build deterministic AssemblyScript WASM fixtures
        run: |
          npm --prefix packages/wasm-sdk ci
          npm --prefix packages/wasm-sdk run check:fixtures

      - name: Fetch Cargo dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build workspace tests
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo build --workspace --tests --locked; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Test workspace
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  musl-static:
    name: MUSL static Extism linkability
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust musl target
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup +1.97.1 target add x86_64-unknown-linux-musl

      - name: Build maw-cli for musl static
        run: cargo build --release --target x86_64-unknown-linux-musl -p maw-cli

  maw-menubar-native:
    name: maw-menubar universal helper
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify committed helper pin and architecture slices
        working-directory: fleet-plugins/maw-menubar
        run: |
          set -euo pipefail
          expected=$(jq -r '.bundledArtifacts[] | select(.path == "bin/maw-menubar") | .sha256' plugin.json)
          actual="sha256:$(shasum -a 256 bin/maw-menubar | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]
          archs=$(/usr/bin/lipo -archs bin/maw-menubar)
          [[ " $archs " == *" arm64 "* ]]
          [[ " $archs " == *" x86_64 "* ]]
          /usr/bin/codesign --verify --strict bin/maw-menubar

      - name: Rebuild universal Swift helper
        working-directory: fleet-plugins/maw-menubar
        run: ./scripts/build-universal.sh
